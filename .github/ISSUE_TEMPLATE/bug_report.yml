name: Bug report
description: Report reproducible incorrect behavior in an implemented capability.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not report security vulnerabilities here. Use private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0-alpha.1 or commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, inputs, and a minimal repository fixture when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, package manager, and agent client.
    validations:
      required: true
